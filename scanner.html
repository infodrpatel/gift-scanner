<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Gift Scanner Pro</title>
  <script src="https://script.google.com/macros/s/AKfycbxAb57SWFtkN1dlPYZzG2LIfzW3vCNwsyv9K29ci0VMiWlSYP5OXDE5lROYjZgURs1u/exec"></script>
</head>
<body>
<script>
  // ⚙️ ADMIN: Ye URL ek baar bhariye (Apps Script "Web App URL", /exec par khatam hota hai).
  // Fir ye file GitHub par upload kar dein — team leaders ko sirf link kholna hoga.
  const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
</script>
  <style>
    :root{
      --primary:#6366F1; --primary2:#8B5CF6; --primary-dark:#4338CA;
      --success:#10B981; --danger:#EF4444; --warn:#F59E0B;
      --bg:#F4F5FB; --card:#FFFFFF; --text:#111827; --muted:#6B7280; --border:#ECEDF7;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;-webkit-text-size-adjust:100%;}
    body{
      font-family:'Segoe UI',Roboto,system-ui,Arial,sans-serif;
      background:var(--bg);color:var(--text);overflow-x:hidden;
      font-size:17px;
    }

    #loginScreen{
      position:fixed;inset:0;
      background:radial-gradient(circle at 20% 10%, #7C6EF6 0%, #6366F1 35%, #4338CA 75%, #341F97 100%);
      display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;
      overflow:hidden;
    }
    .glow{position:absolute;border-radius:50%;filter:blur(50px);opacity:0.4;pointer-events:none;}
    .glow1{width:260px;height:260px;background:#fff;top:-80px;left:-70px;}
    .glow2{width:300px;height:300px;background:#F472B6;bottom:-100px;right:-80px;}
    .login-card{
      position:relative;
      background:rgba(255,255,255,0.98);width:100%;max-width:400px;
      border-radius:28px;padding:40px 28px 32px;
      box-shadow:0 25px 70px rgba(20,10,70,0.4);
      animation:cardIn .5s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
    .login-logo{
      width:84px;height:84px;border-radius:24px;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      display:flex;align-items:center;justify-content:center;font-size:40px;
      margin:0 auto 18px;box-shadow:0 14px 30px rgba(99,102,241,0.45);
    }
    .login-card h2{text-align:center;font-size:27px;font-weight:800;margin-bottom:6px;letter-spacing:-0.3px;}
    .login-card p.sub{text-align:center;font-size:15.5px;color:var(--muted);margin-bottom:26px;}
    .field{
      display:flex;align-items:center;margin-bottom:16px;
      border:2px solid var(--border);border-radius:16px;background:#F9FAFB;padding:0 16px;
      transition:border .2s,background .2s;
    }
    .field:focus-within{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,0.1);}
    .field input{flex:1;min-width:0;width:100%;padding:17px 6px;border:none;background:transparent;font-size:17px;outline:none;}
    .field .fico{font-size:19px;opacity:0.65;margin-right:10px;flex-shrink:0;}
    .login-btn{
      width:100%;padding:17px;border:none;border-radius:16px;
      background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
      font-size:17.5px;font-weight:800;cursor:pointer;margin-top:8px;
      display:flex;align-items:center;justify-content:center;gap:10px;
      box-shadow:0 14px 28px rgba(99,102,241,0.4);
      transition:transform .12s;
    }
    .login-btn:active{transform:scale(0.97);}
    .login-error{
      background:#FEF2F2;color:#B91C1C;border:1.5px solid #FECACA;
      padding:12px 14px;border-radius:14px;font-size:14.5px;margin-bottom:14px;display:none;font-weight:600;
    }
    .login-hint{text-align:center;font-size:13.5px;color:#9CA3AF;margin-top:20px;line-height:1.6;}
    .spinner-sm{
      width:18px;height:18px;border:3px solid rgba(255,255,255,0.4);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;display:none;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    #appScreen{display:none;min-height:100vh;padding-bottom:96px;}
    .topbar{
      background:linear-gradient(135deg,var(--primary-dark),var(--primary) 60%,var(--primary2));
      color:#fff;padding:20px 20px 26px;border-radius:0 0 32px 32px;
      box-shadow:0 12px 30px rgba(79,70,229,0.3);
    }
    .topbar-row{display:flex;align-items:center;justify-content:space-between;}
    .user-chip{display:flex;align-items:center;gap:12px;min-width:0;}
    .avatar{
      width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,0.22);
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex-shrink:0;
      border:2px solid rgba(255,255,255,0.3);
    }
    .uname{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw;}
    .urole{font-size:13.5px;opacity:0.85;font-weight:500;}
    .logout-btn{
      background:rgba(255,255,255,0.18);border:none;color:#fff;
      width:46px;height:46px;border-radius:14px;font-size:20px;cursor:pointer;flex-shrink:0;
    }
    .stats-card{
      background:#fff;border-radius:20px;padding:18px 22px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      margin-bottom:18px;box-shadow:0 6px 22px rgba(20,20,50,0.08);
    }
    .stats-card .num{font-size:30px;font-weight:900;color:var(--primary-dark);white-space:nowrap;line-height:1.1;}
    .stats-card .lbl{font-size:14px;color:var(--muted);white-space:nowrap;font-weight:600;}
    .stats-card .badge{background:#ECFDF5;color:var(--success);font-size:14px;font-weight:800;padding:8px 16px;border-radius:22px;white-space:nowrap;}

    .content{padding:20px 18px 18px;max-width:520px;margin:0 auto;}
    .view{display:none;animation:fadeUp .3s ease;}
    .view.active{display:block;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

    .card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 22px rgba(20,20,50,0.08);margin-bottom:18px;}
    .card h3{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px;}
    label{font-size:13.5px;color:var(--muted);font-weight:800;display:block;margin:12px 0 7px;text-transform:uppercase;letter-spacing:.4px;}
    input[type=text]{
      width:100%;padding:17px 18px;border:2px solid var(--border);border-radius:15px;
      font-size:17px;outline:none;background:#F9FAFB;transition:border .2s,background .2s;
    }
    input[type=text]:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,0.1);}
    select{
      width:100%;padding:17px 18px;border:2px solid var(--border);border-radius:15px;
      font-size:17px;outline:none;background:#F9FAFB;color:var(--text);appearance:none;-webkit-appearance:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2.5'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat:no-repeat;background-position:right 16px center;
    }
    select:focus{border-color:var(--primary);background-color:#fff;}

    #liveReader{width:100%;border-radius:18px;overflow:hidden;background:#000;}
    #liveReader:empty{border:3px dashed #C7D2FE;min-height:80px;background:#FAFAFF;}
    #liveReader video{width:100% !important;border-radius:18px;}
    .scan-frame-hint{text-align:center;font-size:14px;color:var(--muted);margin-top:12px;line-height:1.6;font-weight:500;}

    .btn{
      width:100%;padding:18px;border:none;border-radius:16px;font-size:18px;font-weight:800;
      cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;
      transition:transform .12s;
    }
    .btn:active{transform:scale(0.97);}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 10px 24px rgba(99,102,241,0.4);}
    .btn-success{background:linear-gradient(135deg,#22C55E,var(--success));color:#fff;box-shadow:0 10px 24px rgba(16,185,129,0.4);}

    .result{border-radius:18px;padding:16px 18px;margin-top:16px;font-size:16px;display:none;animation:pop .25s ease;}
    @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
    .result.success{background:#ECFDF5;color:#065F46;border:2px solid #A7F3D0;display:block;}
    .result.error{background:#FEF2F2;color:#991B1B;border:2px solid #FECACA;display:block;}
    .result.warn{background:#FFFBEB;color:#92400E;border:2px solid #FDE68A;display:block;}
    .result b{display:block;font-size:16.5px;margin-bottom:6px;}
    .result .meta{font-size:14.5px;opacity:0.9;margin-top:2px;line-height:1.7;}

    .bottom-nav{
      position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;
      padding:12px 20px calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -8px 24px rgba(20,20,50,0.1);border-radius:26px 26px 0 0;z-index:50;
    }
    .nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
      background:transparent;border:none;padding:8px 6px;cursor:pointer;
      color:var(--muted);font-size:13.5px;font-weight:800;border-radius:16px;
      transition:background .2s,color .2s;
    }
    .nav-item .nico{font-size:26px;}
    .nav-item.active{color:var(--primary);background:#EEF2FF;}
    .hidden{display:none !important;}
  </style>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="login-card">
      <div class="login-logo">🎁</div>
      <h2>Gift Scanner Pro</h2>
      <p class="sub">Login karke scanning shuru karein</p>
      <div class="login-error" id="loginError"></div>
      <div class="field"><span class="fico">👤</span><input type="text" id="loginUser" placeholder="Username" autocomplete="username"></div>
      <div class="field"><span class="fico">🔒</span><input type="password" id="loginPass" placeholder="Password" autocomplete="current-password"></div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">
        <span>Login</span><span class="spinner-sm" id="loginSpinner"></span>
      </button>
      <p class="login-hint">Apna Username/Password admin se lein</p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appScreen">
    <div class="topbar">
      <div class="topbar-row">
        <div class="user-chip">
          <div class="avatar" id="avatarInitials">U</div>
          <div><div class="uname" id="userNameDisplay">User</div><div class="urole">Team Leader</div></div>
        </div>
        <button class="logout-btn" onclick="doLogout()">⏻</button>
      </div>
    </div>

    <div class="content">
      <div class="stats-card">
        <div><div class="num" id="totalCount">--</div><div class="lbl">Total Gifts Distributed</div></div>
        <div class="badge">🟢 Live</div>
      </div>

      <!-- SCAN VIEW -->
      <div class="view active" id="view-scan">
        <div class="card">
          <h3>📸 Gift QR Scan Karein</h3>
          <button class="btn btn-primary" id="liveScanBtn" onclick="toggleLiveScan()">
            <span id="liveScanBtnText">🔴 Camera Scan Start Karein</span>
          </button>
          <div id="liveReader" style="margin-top:16px;"></div>
          <p class="scan-frame-hint">QR ko frame me lekar rakhein, apne aap turant detect ho jayega.</p>
        </div>
        <div class="result" id="scanResult"></div>
      </div>

      <!-- MANUAL VIEW -->
      <div class="view" id="view-manual">
        <div class="card">
          <h3>✍️ Manual Entry</h3>
          <label>Gift ID <span style="color:var(--danger)">*</span></label>
          <input type="text" id="manualCode" placeholder="Gift ID daalein">
          <label>Name <span style="color:var(--danger)">*</span></label>
          <input type="text" id="manualName" placeholder="Naam daalein (min. 4 letters)">
          <label>Mobile Number <span style="color:var(--danger)">*</span></label>
          <input type="text" id="manualMobile" placeholder="10 digit mobile number" inputmode="numeric" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <label>Selection (Center) <span style="color:var(--danger)">*</span></label>
          <select id="manualSelection">
            <option value="">-- Center Select Karein --</option>
            <option value="Balika Mandal Trilok">Balika Mandal Trilok</option>
            <option value="Swagat">Swagat</option>
            <option value="Jivanwadi">Jivanwadi</option>
            <option value="Vastral">Vastral</option>
            <option value="Ratapura">Ratapura</option>
            <option value="Prakash">Prakash</option>
            <option value="Madhav Homes">Madhav Homes</option>
            <option value="Hathijan">Hathijan</option>
            <option value="Ghanshyamnagar">Ghanshyamnagar</option>
          </select>
          <button class="btn btn-success" id="manualBtn" onclick="submitManual()">
            <span>💾 Save Entry</span><span class="spinner-sm" id="manualSpinner"></span>
          </button>
          <div class="result" id="manualResult"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="nav-item active" id="navScan" onclick="switchView('scan')"><span class="nico">🔎</span>Scan</button>
    <button class="nav-item" id="navManual" onclick="switchView('manual')"><span class="nico">✍️</span>Manual</button>
  </div>

<script>
  let currentUser = null;
  let liveScanner = null;
  let liveScanActive = false;

  window.addEventListener('load', function(){
    const saved = sessionStorage.getItem('qr_user');
    if(saved){
      try{ currentUser = JSON.parse(saved); enterApp(); }
      catch(e){ document.getElementById('loginScreen').style.display = 'flex'; }
    }
  });

  async function apiCall(params){
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(API_URL + '?' + qs, { method: 'GET' });
    if(!res.ok) throw new Error('Server error: ' + res.status);
    return await res.json();
  }

  function doLogin(){
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginSpinner');
    errBox.style.display = 'none';
    if(!username || !password){
      errBox.innerText = 'Username aur Password dono daalein.';
      errBox.style.display = 'block';
      return;
    }
    btn.disabled = true; spinner.style.display = 'inline-block';
    apiCall({ action: 'login', username: username, password: password })
      .then(res => {
        btn.disabled = false; spinner.style.display = 'none';
        if(res.success){
          currentUser = { username: res.username, fullName: res.fullName };
          sessionStorage.setItem('qr_user', JSON.stringify(currentUser));
          enterApp();
        } else {
          errBox.innerText = res.message || 'Login fail ho gaya.';
          errBox.style.display = 'block';
        }
      })
      .catch(err => {
        btn.disabled = false; spinner.style.display = 'none';
        errBox.innerText = 'Server se connect nahi ho paaya. (' + err.message + ')';
        errBox.style.display = 'block';
      });
  }
  function doLogout(){
    if(liveScanActive) stopLiveScan();
    sessionStorage.removeItem('qr_user');
    currentUser = null;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
  }
  function enterApp(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    const initials = currentUser.fullName.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    document.getElementById('avatarInitials').innerText = initials || 'U';
    document.getElementById('userNameDisplay').innerText = currentUser.fullName;
    loadStats();
  }

  function switchView(view){
    if(view === 'manual' && liveScanActive) stopLiveScan();
    document.getElementById('view-scan').classList.toggle('active', view==='scan');
    document.getElementById('view-manual').classList.toggle('active', view==='manual');
    document.getElementById('navScan').classList.toggle('active', view==='scan');
    document.getElementById('navManual').classList.toggle('active', view==='manual');
  }

  function loadStats(){
    apiCall({ action: 'stats' }).then(stats => {
      document.getElementById('totalCount').innerText = stats.total;
    }).catch(()=>{});
  }

  function toggleLiveScan(){
    if(liveScanActive){ stopLiveScan(); return; }
    hideResult('scanResult');
    document.getElementById('liveScanBtnText').innerText = '⏳ Camera Khul Rahi Hai...';

    const config = { fps: 10, qrbox: { width: 260, height: 260 } };
    liveScanner = new Html5Qrcode("liveReader");

    liveScanner.start(
      { facingMode: "environment" },
      config,
      (decodedText) => { stopLiveScan(); onScanSuccess(decodedText); },
      (errorMessage) => {}
    ).then(() => {
      liveScanActive = true;
      document.getElementById('liveScanBtnText').innerText = '⏹️ Scan Band Karein';
    }).catch(err => {
      liveScanActive = false;
      document.getElementById('liveScanBtnText').innerText = '🔴 Camera Scan Start Karein';
      const errStr = (err && err.name) ? err.name : String(err);
      showResult('scanResult', 'error', '⚠️ Camera Error', errStr + '<br>"Manual" tab se entry karein.');
    });
  }
  function stopLiveScan(){
    if(liveScanner && liveScanActive){
      liveScanner.stop().then(() => {
        liveScanner.clear();
        liveScanActive = false;
        document.getElementById('liveScanBtnText').innerText = '🔴 Camera Scan Start Karein';
      }).catch(() => {
        liveScanActive = false;
        document.getElementById('liveScanBtnText').innerText = '🔴 Camera Scan Start Karein';
      });
    } else {
      liveScanActive = false;
      document.getElementById('liveScanBtnText').innerText = '🔴 Camera Scan Start Karein';
    }
  }

  function parseQRText(text){
    const result = { giftId: '', name: '', mobile: '', selection: '' };
    text.split(/\r?\n/).forEach(line => {
      const idx = line.indexOf(':');
      if(idx === -1) return;
      const key = line.substring(0, idx).trim().toLowerCase().replace(/\s+/g, ' ');
      const value = line.substring(idx + 1).trim();
      if(!value) return;
      if(key === 'name') result.name = value;
      else if(key.indexOf('mobile') !== -1 || key.indexOf('phone') !== -1) result.mobile = value.replace(/[^0-9]/g, '');
      else if(key.indexOf('mandal') !== -1 || key.indexOf('center') !== -1 || key.indexOf('centre') !== -1) result.selection = value;
      else if(key.indexOf('gift') !== -1) result.giftId = value;
    });
    if(!result.giftId) result.giftId = text.trim();
    return result;
  }

  function onScanSuccess(qrValue){
    const parsed = parseQRText(qrValue);
    showResult('scanResult', 'warn', '⏳ Checking...', 'Data save ho raha hai, please wait.');
    apiCall({
      action: 'save', qr: parsed.giftId, name: parsed.name, mobile: parsed.mobile, selection: parsed.selection,
      entryType: 'QR Scan', user: currentUser ? currentUser.fullName : 'Unknown User'
    }).then(res => handleSaveResponse(res, 'scanResult'))
      .catch(err => showResult('scanResult', 'error', '❌ Error', err.message || 'Kuch galat ho gaya.'));
  }

  function submitManual(){
    const code = document.getElementById('manualCode').value.trim();
    const name = document.getElementById('manualName').value.trim();
    const mobile = document.getElementById('manualMobile').value.trim();
    const selection = document.getElementById('manualSelection').value;

    if(!code){ showResult('manualResult', 'error', '⚠️ Required', 'Gift ID daalna zaroori hai.'); return; }
    if(name.length < 4){ showResult('manualResult', 'error', '⚠️ Invalid Name', 'Name kam se kam 4 letters ka hona chahiye.'); return; }
    if(!/^[6-9]\d{9}$/.test(mobile)){ showResult('manualResult', 'error', '⚠️ Invalid Mobile', 'Mobile 10 digit, 6/7/8/9 se start hona chahiye.'); return; }
    if(!selection){ showResult('manualResult', 'error', '⚠️ Required', 'Center select karna zaroori hai.'); return; }

    const btn = document.getElementById('manualBtn');
    const spinner = document.getElementById('manualSpinner');
    btn.disabled = true; spinner.style.display = 'inline-block';
    hideResult('manualResult');

    apiCall({
      action: 'save', qr: code, name: name, mobile: mobile, selection: selection,
      entryType: 'Manual Entry', user: currentUser ? currentUser.fullName : 'Unknown User'
    }).then(res => {
      btn.disabled = false; spinner.style.display = 'none';
      handleSaveResponse(res, 'manualResult');
      if(res.success){
        document.getElementById('manualCode').value = '';
        document.getElementById('manualName').value = '';
        document.getElementById('manualMobile').value = '';
        document.getElementById('manualSelection').value = '';
      }
    }).catch(err => {
      btn.disabled = false; spinner.style.display = 'none';
      showResult('manualResult', 'error', '❌ Error', err.message || 'Kuch galat ho gaya.');
    });
  }

  function handleSaveResponse(res, targetId){
    if(res.success){
      showResult(targetId, 'success', '✅ Saved Successfully!',
        `${res.data.qrValue ? 'Gift No: ' + res.data.qrValue + '<br>' : ''}${res.data.name ? 'Name: ' + res.data.name + '<br>' : ''}${res.data.mobile ? 'Mobile: ' + res.data.mobile + '<br>' : ''}${res.data.selection ? 'Center: ' + res.data.selection + '<br>' : ''}Date: ${res.data.date} | Time: ${res.data.time}<br>Scanned By: ${res.data.user}`);
      loadStats();
    } else if(res.duplicate){
      showResult(targetId, 'warn', '⚠️ Duplicate Entry!',
        `Ye code pehle scan ho chuka hai.<br>By: ${res.details.scannedBy} | ${res.details.date} ${res.details.time}`);
    } else {
      showResult(targetId, 'error', '❌ Failed', res.message);
    }
  }
  function showResult(id, type, title, meta){
    const el = document.getElementById(id);
    el.className = 'result ' + type;
    el.innerHTML = '<b>' + title + '</b><div class="meta">' + meta + '</div>';
  }
  function hideResult(id){
    const el = document.getElementById(id);
    el.className = 'result'; el.innerHTML = '';
  }
</script>
</body>
</html>
